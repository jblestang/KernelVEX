stages:
  - test
  - package
  - integration

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

lint-and-unit:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir -e ".[dev]"
  script:
    - ruff check src tests
    - ruff format --check src tests
    - python -W error -m compileall -q -f src tests
    - pytest -v --cov=kernelvex --cov-report=term-missing

oci-build:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker run --rm --entrypoint /bin/sh "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -c 'id -u | grep -qx 10001 && cve-triage --version && kmaxall --help >/dev/null'

integration:
  stage: integration
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  cache:
    key: kernelvex-integration-cache
    paths:
      - .cache/integration/
  script:
    - apk add --no-cache bash git python3
    - WORK_ROOT="$CI_PROJECT_DIR/.cache/integration" IMAGE_TAG="kernelvex:ci" bash scripts/verify_full_linux.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .cache/integration/out/*.json

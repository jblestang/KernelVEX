[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelvex"
version = "0.1.0"
description = "Industrial Linux kernel CVE triage and OpenVEX 0.2.0 orchestration layer over cip-kernel-sec, kernel-cve-triage, and kmax."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml>=6.0.1,<7.0",
    "packageurl-python>=0.11.0,<1.0",
    "jsonschema>=4.20.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[project.scripts]
kernelvex = "kernelvex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kernelvex = ["schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_network: clones public cip-kernel-sec over HTTPS",
]

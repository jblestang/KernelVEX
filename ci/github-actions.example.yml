# Example GitHub Actions workflow for industrial Linux kernel OpenVEX generation.
# Demonstrates persistent caching of cip-kernel-sec and kmax formulas across CI runs.

name: Kernel OpenVEX Pipeline (Example)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vex-cip-full:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/example/kernelvex:0.1.0
      options: --entrypoint ""
    env:
      KERNELVEX_CACHE_DIR: ${{ github.workspace }}/.cache/kernelvex
    steps:
      - uses: actions/checkout@v4

      - name: Restore kernelvex cache (cip-kernel-sec & kmax formulas)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/kernelvex
          key: kernelvex-cip-${{ hashFiles('artifacts/.config') }}
          restore-keys: |
            kernelvex-cip-

      - name: Run full compile-time triage and emit OpenVEX 0.2.0
        id: triage
        shell: bash
        run: |
          mkdir -p vex
          set +e
          kernelvex ci pipeline \
            --profile cip \
            --kernel-version "${KERNEL_VERSION:-v5.10.224-cip52}" \
            --kernel-config artifacts/.config \
            --kernel-source "${{ github.workspace }}/linux-cip" \
            --stable-branch cip/5.10 \
            --mode full \
            --cve-since-year 2024 \
            --author "Product Security Team" \
            --output vex/openvex.json
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          # Exit 10 indicates open triage (under_investigation); 20/30 fail the job.
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 10 ]; then
            exit "${rc}"
          fi

      - name: Upload OpenVEX 0.2.0 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvex-cip
          path: vex/openvex.json

  vex-standard-quick:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/example/kernelvex:0.1.0
      options: --entrypoint ""
    env:
      KERNELVEX_CACHE_DIR: ${{ github.workspace }}/.cache/kernelvex
    steps:
      - uses: actions/checkout@v4

      - name: Run conservative quick triage on standard stable branch
        shell: bash
        run: |
          mkdir -p vex
          set +e
          kernelvex ci pipeline \
            --profile standard \
            --kernel-version "5.15.165" \
            --kernel-config artifacts/.config \
            --stable-branch stable/5.15 \
            --mode quick \
            --cve-since-year 2024 \
            --output vex/openvex-standard-quick.json
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 10 ]; then
            exit "${rc}"
          fi

      - name: Upload OpenVEX quick artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvex-standard-quick
          path: vex/openvex-standard-quick.json

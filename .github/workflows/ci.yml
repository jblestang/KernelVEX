name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-unit-live-sec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint, format, and compile check
        run: |
          ruff check src tests
          ruff format --check src tests
          python -W error -m compileall -q -f src tests

      - name: Run unit, schema, golden, and live cip-kernel-sec tests
        run: pytest -v --cov=kernelvex --cov-report=term-missing

  oci-build-and-integration:
    runs-on: ubuntu-24.04
    needs: [lint-unit-live-sec]
    steps:
      - uses: actions/checkout@v4

      - name: Cache kernel sources and kmax formulas
        uses: actions/cache@v4
        with:
          path: /tmp/kernelvex-full-verify
          key: kernelvex-full-verify-v1-${{ hashFiles('PINS.lock', 'Dockerfile') }}

      - name: Build OCI image and verify full-mode CIP + standard triage
        run: bash scripts/verify_full_linux.sh

      - name: Upload OpenVEX integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-openvex
          path: /tmp/kernelvex-full-verify/out/*.json
